name: Telegram yangiliklarini yangilash

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 daqiqada
  workflow_dispatch: {}       # qo'lda ishga tushirish tugmasi

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kanal nomini o'qish va postlarni olish
        run: |
          CHANNEL=$(python -c "import json;print(json.load(open('data/school.json'))['telegram'])")
          python scripts/fetch_telegram.py "$CHANNEL"
      - name: O'zgarish bo'lsa saqlash
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json assets/news
          git diff --cached --quiet || (git commit -m "Yangiliklar yangilandi" && git push)
